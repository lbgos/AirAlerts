[project]
name = "ua-alert-forecast"
version = "0.1.0"
description = "Air raid alert forecasting for Ukraine from Telegram radar channels"
readme = "README.md"
authors = [
    { name = "lbgos", email = "285507185+lbgos@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "lightgbm>=4.7.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "qrcode>=8.2",
    "scikit-learn>=1.9.1",
    "tabulate>=0.10.0",
    "telethon>=1.45.0",
]

[project.scripts]
forecast = "ua_alert_forecast.cli:main"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
