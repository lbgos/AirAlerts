<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>AirAlerts</title>
<script>
  // Theme before first paint: "auto" follows the system, otherwise the saved choice.
  const themePref = localStorage.getItem("theme") || "auto";
  const effectiveTheme = () => (themePref === "auto" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : themePref);
  document.documentElement.dataset.theme = effectiveTheme();
</script>
<style>
  [data-theme="dark"] { --bg: #000; --fg: #fff; --dim: #8e8e93; --line: #1c1c1e; --track: #1c1c1e; --nodata: #4a4a4e; --red: #ff453a; --border: #3a3a3c; }
  [data-theme="light"] { --bg: #fff; --fg: #000; --dim: #6e6e73; --line: #e5e5ea; --track: #ececee; --nodata: #b9b9be; --red: #d70015; --border: #c7c7cc; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    padding: max(14px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    max-width: 680px; margin: 0 auto;
  }
  header { display: flex; align-items: baseline; gap: 14px; }
  h1 { font-size: 20px; font-weight: 650; margin: 0; letter-spacing: -0.01em; flex: 1; }
  header button { background: none; border: 0; color: var(--dim); font: inherit; padding: 4px 0; cursor: pointer; }
  .asof { margin: 4px 0 0; font-size: 13px; color: var(--dim); }
  .asof b { color: var(--fg); font-weight: 600; }
  .controls { display: flex; align-items: center; gap: 10px; margin: 12px 0 4px; }
  select {
    appearance: none; -webkit-appearance: none; background-color: var(--bg); color: var(--fg); font: inherit; font-weight: 600;
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 30px 7px 11px;
    background-image: linear-gradient(45deg, transparent 50%, var(--fg) 50%), linear-gradient(135deg, var(--fg) 50%, transparent 50%);
    background-position: right 14px top 50%, right 9px top 50%; background-size: 5px 5px; background-repeat: no-repeat;
  }
  .what { color: var(--dim); font-size: 13px; }
  svg { display: block; width: 100%; height: auto; margin-top: 8px; touch-action: manipulation; }
  svg path.region { stroke: var(--bg); stroke-width: 1.6; cursor: pointer; }
  svg path.region.selected { stroke: var(--fg); stroke-width: 3; }
  svg .nodata { fill: var(--nodata); stroke: var(--bg); stroke-width: 1.6; }
  svg text { font-weight: 650; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-top: 6px; font-size: 12px; color: var(--dim); }
  .scale { flex: 1; min-width: 120px; }
  .scale .key { margin-bottom: 3px; }
  .scale .ramp { height: 8px; border-radius: 4px; }
  .scale .ticks { display: flex; justify-content: space-between; margin-top: 2px; }
  .swatch { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -3px; margin-right: 6px;
    background: repeating-linear-gradient(45deg, var(--red) 0 3px, var(--bg) 3px 6px); }
  .swatch.nodata { background: var(--nodata); }
  .caption { min-height: 20px; margin: 8px 0 0; font-size: 14px; }
  ol { list-style: none; margin: 4px 0 0; padding: 0; }
  li {
    display: grid; grid-template-columns: minmax(0, max-content) auto 1fr 30%; align-items: center; column-gap: 8px;
    padding: 9px 0; border-bottom: 1px solid var(--line); cursor: pointer;
  }
  li.selected { background: var(--line); }
  .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pct { font-weight: 650; }
  .bar { grid-column: 4; height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 3px; }
  li.active { padding: 6px 0; }
  .name small { display: block; color: var(--dim); font-size: 12px; margin-top: 1px; }
  .hist { font-size: 13px; }
  .hist table { border-collapse: collapse; width: 100%; margin-top: 8px; }
  .hist th, .hist td { padding: 3px 0; text-align: right; font-weight: 400; color: var(--dim); }
  .hist th:first-child, .hist td:first-child { text-align: left; }
  .hist td.in { color: var(--fg); font-weight: 650; }
  .hist .hl { display: flex; justify-content: space-between; gap: 8px; margin-top: 12px; }
  .hist .hl b { font-weight: 650; }
  .hist svg { margin-top: 4px; touch-action: pan-y; cursor: crosshair; }
  .hist svg text { font-weight: 400; fill: var(--dim); }
  .hist ol { max-height: 236px; overflow-y: auto; margin-top: 10px; border-top: 1px solid var(--line); }
  .hist ol li { display: flex; justify-content: space-between; padding: 7px 0; }
  .hist .dim { color: var(--dim); font-size: 12px; margin-top: 8px; line-height: 1.5; }
  footer { margin-top: 16px; color: var(--dim); font-size: 12px; line-height: 1.5; }
  .stale { color: #ff9f0a; }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <button id="theme"></button>
  <button id="lang"></button>
</header>
<p class="asof" id="asof"></p>
<div class="controls">
  <select id="horizon" aria-label="horizon"></select>
  <select id="variant" aria-label="model" hidden></select>
  <span class="what" id="what"></span>
</div>
<svg id="map" role="img"></svg>
<div class="legend">
  <div class="scale"><div class="key" id="startKey"></div><div class="ramp" id="ramp"></div><div class="ticks"><span>0</span><span>50</span><span>100%</span></div></div>
  <div class="scale"><div class="key" id="clearKey"></div><div class="ramp" id="rampClear"></div><div class="ticks"><span>0</span><span>50</span><span>100%</span></div></div>
  <span><span class="swatch nodata"></span><span id="nodataKey"></span></span>
</div>
<p class="caption" id="caption"></p>
<div class="hist" id="history"></div>
<ol id="list"></ol>
<footer id="foot"></footer>

<script>
const NAMES = {
  vinnytska: ["Вінницька", "Vinnytsia"], volynska: ["Волинська", "Volyn"], dnipropetrovska: ["Дніпропетровська", "Dnipropetrovsk"],
  donetska: ["Донецька", "Donetsk"], zhytomyrska: ["Житомирська", "Zhytomyr"], zakarpatska: ["Закарпатська", "Zakarpattia"],
  zaporizka: ["Запорізька", "Zaporizhzhia"], ivano_frankivska: ["Івано-Франківська", "Ivano-Frankivsk"],
  kyivska: ["Київська", "Kyiv oblast"], kyiv: ["м. Київ", "Kyiv city"], kirovohradska: ["Кіровоградська", "Kirovohrad"],
  luhanska: ["Луганська", "Luhansk"], lvivska: ["Львівська", "Lviv"], mykolaivska: ["Миколаївська", "Mykolaiv"],
  odeska: ["Одеська", "Odesa"], poltavska: ["Полтавська", "Poltava"], rivnenska: ["Рівненська", "Rivne"],
  sumska: ["Сумська", "Sumy"], ternopilska: ["Тернопільська", "Ternopil"], kharkivska: ["Харківська", "Kharkiv"],
  khersonska: ["Херсонська", "Kherson"], khmelnytska: ["Хмельницька", "Khmelnytskyi"], cherkaska: ["Черкаська", "Cherkasy"],
  chernivetska: ["Чернівецька", "Chernivtsi"], chernihivska: ["Чернігівська", "Chernihiv"],
};
const T = {
  uk: {
    title: "Прогноз тривог", other: "EN", what: "горизонт прогнозу",
    asof: "Прогноз станом на", every: "оновлюється кожні 30 с",
    startKey: "почнеться тривога", clearKey: "відбій (області під тривогою)", clearIn: "відбій",
    h: { "15m": "15 хв", "30m": "30 хв", "1h": "1 год", "3h": "3 год", "6h": "6 год" }, within: "за",
    theme: { auto: "тема: авто", dark: "тема: темна", light: "тема: світла" },
    alert: "тривога", alertNow: "тривога зараз", nodata: "окуповано", min: "хв", hr: "год", updated: "оновлено", lastPost: "останній пост каналу",
    variants: { tested: "перевірена модель", untested: "неперевірена модель" },
    untestedNote: "Неперевірена модель: навчена на всіх даних до останнього поста, без калібрування і без перевірки. Її відсотки можуть бути завищені або занижені.",
    ongoing: "триває", beforeStart: "до тривоги", beforeEnd: "до відбою", chartStart: "перед тривогою", chartEnd: "перед відбоєм",
    lead: (d, k) => `за ${d} ${k === "start" ? "до тривоги" : "до відбою"}`,
    noAlerts: "За 7 днів тривог із записаним прогнозом немає. Прогнози записуються з",
    noRecord: "Для цієї моделі запису немає: неперевірена модель записується з 11.10.",
    histNote: (h) => `Що обрана модель показувала перед цією тривогою, як записано тоді. Жирним і заштриховано: прогнози, після яких подія справді настала протягом ${h}. Влучна модель дає тут високі відсотки, а раніше низькі. Проведіть по графіку, щоб побачити кожну хвилину.`,
    stale: "дані застаріли", model: "модель", trained: "навчена до", tap: "Торкніться області на мапі або в списку.",
    note: "Ймовірності відкалібровані: з прогнозів «30%» тривога починалась приблизно у 3 з 10 випадків. Джерело: @UkraineAlarmSignal. Не офіційне попередження — слухайте сирени. Мапа: geoBoundaries, © OpenStreetMap. Зроблено на Python: LightGBM, scikit-learn, pandas, NumPy, Telethon.",
  },
  en: {
    title: "Air alert forecast", other: "УКР", what: "forecast horizon",
    asof: "Forecast as of", every: "updates every 30 s",
    startKey: "siren starts", clearKey: "all-clear (oblasts under alert)", clearIn: "all-clear",
    h: { "15m": "15 min", "30m": "30 min", "1h": "1 hour", "3h": "3 hours", "6h": "6 hours" }, within: "within",
    theme: { auto: "theme: auto", dark: "theme: dark", light: "theme: light" },
    alert: "alert", alertNow: "alert now", nodata: "occupied", min: "min", hr: "h", updated: "updated", lastPost: "last channel post",
    variants: { tested: "tested model", untested: "untested model" },
    untestedNote: "Untested model: trained on all data up to the last post, with no calibration and no test. Its percentages may run high or low.",
    ongoing: "ongoing", beforeStart: "before the alert", beforeEnd: "before all-clear", chartStart: "before the alert", chartEnd: "before the all-clear",
    lead: (d, k) => `${d} ${k === "start" ? "before the alert" : "before the all-clear"}`,
    noAlerts: "No alerts with a logged forecast in the last 7 days. Forecasts are logged since",
    noRecord: "No record for this model: the untested model is logged since 11.10.",
    histNote: (h) => `What the chosen model showed before this alert, as logged at the time. Bold and shaded: forecasts after which the event did happen within ${h}. A good model is high there and low before. Drag across the chart to see each minute.`,
    stale: "data is stale", model: "model", trained: "trained until", tap: "Tap an oblast on the map or in the list.",
    note: "Probabilities are calibrated: of forecasts saying 30%, about 3 in 10 saw a siren start. Source: @UkraineAlarmSignal. Not an official warning — follow the sirens. Map: geoBoundaries, © OpenStreetMap. Built with Python: LightGBM, scikit-learn, pandas, NumPy, Telethon.",
  },
};
// One warm hue per theme: near the surface at 0%, saturated red at 100% (lighter in dark mode, darker in light mode).
const RAMPS = {
  dark: ["#2a2321", "#5c1d18", "#a3281e", "#ec3b2c", "#ff7259"],
  light: ["#efeeec", "#f7c6ba", "#ee7c63", "#d23a2b", "#8a1a12"],
};
// All-clear chances for oblasts under alert: one blue hue, same lightness logic.
const CLEAR_RAMPS = {
  dark: ["#1a2230", "#16365f", "#1d5aa6", "#3b8bf0", "#8fc2ff"],
  light: ["#e8eef6", "#bad3f3", "#70a6ea", "#2a73cf", "#124a91"],
};
// Grey, no forecast: Crimea and Sevastopol (drawn from geo.other) and Luhansk oblast, which is occupied and has had
// no alert posts in the channel (0 in the 28 days before 2026-10-10).
const NO_DATA = new Set(["luhanska"]);
// Kyiv city is too small to read at phone width: it is repeated as an inset in the empty bottom-left corner.
const INSET = { x: 40, y: 500, size: 120 };

let lang = localStorage.getItem("lang") || "uk";
let horizon = localStorage.getItem("horizon") || "15m";
let variant = localStorage.getItem("variant") || "tested";
// Start / all-clear chances of the chosen model; state.json has pu / pcu only once an untested model is fitted.
const P = (r) => (variant === "untested" && r.pu ? r.pu : r.p);
const PC = (r) => (variant === "untested" && r.pcu ? r.pcu : r.pc);
let theme = themePref;
let state = null, geo = null, selected = null;
// Selected oblast's past alerts (/history.json): {region, since, alerts: [{start, end}], start: picked alert, data: its forecasts}
let hist = null;
const LEADS = [180, 60, 30, 15, 5]; // table columns: minutes before the event
const HMIN = { "15m": 15, "30m": 30, "1h": 60, "3h": 180, "6h": 360 };

const $ = (id) => document.getElementById(id);
const locale = () => (lang === "uk" ? "uk-UA" : "en-GB");
const time = (iso) => new Date(iso).toLocaleTimeString(locale(), { hour: "2-digit", minute: "2-digit" });
const date = (iso) => new Date(iso).toLocaleDateString(locale(), { day: "2-digit", month: "2-digit" });
const pct = (p) => (p < 0.01 ? "<1%" : Math.round(p * 100) + "%");
const duration = (m, t) => (m < 60 ? `${m} ${t.min}` : `${Math.floor(m / 60)} ${t.hr} ${m % 60} ${t.min}`);
const name = (id) => NAMES[id]?.[lang === "uk" ? 0 : 1] ?? id;

// Colour interpolation in OKLab, so steps look evenly spaced.
const toLin = (c) => (c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4);
const toSrgb = (c) => (c <= 0.0031308 ? 12.92 * c : 1.055 * c ** (1 / 2.4) - 0.055);
function hexToLab(hex) {
  const [r, g, b] = [1, 3, 5].map((i) => toLin(parseInt(hex.slice(i, i + 2), 16) / 255));
  const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
  const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
  const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
  return [0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s, 1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s, 0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s];
}
function labToHex([L, A, B]) {
  const l = (L + 0.3963377774 * A + 0.2158037573 * B) ** 3, m = (L - 0.1055613458 * A - 0.0638541728 * B) ** 3, s = (L - 0.0894841775 * A - 1.291485548 * B) ** 3;
  const rgb = [4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s, -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s, -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s];
  return "#" + rgb.map((c) => Math.round(Math.min(1, Math.max(0, toSrgb(c))) * 255).toString(16).padStart(2, "0")).join("");
}
function color(p, ramps = RAMPS) {
  const stops = ramps[document.documentElement.dataset.theme].map(hexToLab);
  const x = Math.min(Math.max(p, 0), 1) * (stops.length - 1), i = Math.min(Math.floor(x), stops.length - 2), f = x - i;
  return labToHex(stops[i].map((v, k) => v + (stops[i + 1][k] - v) * f));
}
const clearColor = (p) => color(p, CLEAR_RAMPS);
const ink = (hex) => (hexToLab(hex)[0] > 0.66 ? "#000" : "#fff"); // label colour readable on the fill

function applyTheme() {
  document.documentElement.dataset.theme = theme === "auto" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : theme;
  document.querySelector('meta[name="theme-color"]').content = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
}

function renderMap(byId, t) {
  if (!geo) return;
  const svg = $("map");
  svg.setAttribute("viewBox", geo.viewBox);
  const value = (r) => (r.active ? PC(r)[horizon] : P(r)[horizon]);
  const fillOf = (r) => (r.active ? clearColor(value(r)) : color(value(r)));
  const labelOf = (r, x, y, size) => `<text x="${x}" y="${y}" font-size="${size}" fill="${ink(fillOf(r))}">${pct(value(r))}</text>`;
  let out = "";
  out += [...geo.other, ...[...NO_DATA].map((id) => geo.regions[id].d)].map((d) => `<path class="nodata" d="${d}"/>`).join("");
  const ids = Object.keys(geo.regions).filter((id) => byId[id]).sort((a, b) => (a === "kyiv") - (b === "kyiv")); // city on top
  for (const id of ids) {
    out += `<path class="region${id === selected ? " selected" : ""}" data-id="${id}" d="${geo.regions[id].d}" fill="${fillOf(byId[id])}"><title>${name(id)}</title></path>`;
  }
  for (const id of ids) if (id !== "kyiv") out += labelOf(byId[id], ...geo.regions[id].label, 30);
  const k = byId.kyiv;
  if (k) {
    const { x, y, size } = INSET;
    out += `<rect class="region${selected === "kyiv" ? " selected" : ""}" data-id="kyiv" x="${x}" y="${y}" width="${size}" height="${size}" rx="14"
      fill="${fillOf(k)}" stroke="${selected === "kyiv" ? "var(--fg)" : "var(--border)"}" stroke-width="${selected === "kyiv" ? 3 : 1.5}" style="cursor:pointer"/>`;
    out += labelOf(k, x + size / 2, y + size / 2, 34);
    out += `<text x="${x + size / 2}" y="${y - 22}" font-size="26" fill="var(--fg)">${name("kyiv")}</text>`;
  }
  svg.innerHTML = out;
  svg.setAttribute("aria-label", t.title);
}

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  $("title").textContent = t.title;
  $("lang").textContent = t.other;
  $("theme").textContent = t.theme[theme];
  $("what").textContent = t.what;
  $("nodataKey").textContent = t.nodata;
  $("ramp").style.background = `linear-gradient(90deg, ${[0, 0.25, 0.5, 0.75, 1].map((v) => color(v)).join(", ")})`;
  $("rampClear").style.background = `linear-gradient(90deg, ${[0, 0.25, 0.5, 0.75, 1].map(clearColor).join(", ")})`;
  $("startKey").textContent = t.startKey;
  $("clearKey").textContent = t.clearKey;
  $("horizon").innerHTML = Object.entries(t.h)
    .map(([k, v]) => `<option value="${k}"${k === horizon ? " selected" : ""}>${v}</option>`).join("");
  $("variant").innerHTML = Object.entries(t.variants)
    .map(([k, v]) => `<option value="${k}"${k === variant ? " selected" : ""}>${v}</option>`).join("");
  if (!state) return;
  $("variant").hidden = !state.regions.some((r) => r.pu);

  const regions = state.regions.filter((r) => !NO_DATA.has(r.id));
  const byId = Object.fromEntries(regions.map((r) => [r.id, r]));
  renderMap(byId, t);

  const s = selected && byId[selected];
  $("caption").innerHTML = s
    ? `<b>${name(s.id)}</b> · ${s.active ? `${t.alert} ${duration(s.alert_minutes, t)} · ${t.clearIn} ${pct(PC(s)[horizon])} ${t.within} ${t.h[horizon]}` : `${t.startKey} ${pct(P(s)[horizon])} ${t.within} ${t.h[horizon]}`}`
    : `<span style="color:var(--dim)">${t.tap}</span>`;

  renderHistory(t);

  const rows = [...regions].sort((a, b) =>
    a.active !== b.active ? (a.active ? 1 : -1) : a.active ? PC(b)[horizon] - PC(a)[horizon] : P(b)[horizon] - P(a)[horizon]);
  $("list").innerHTML = rows.map((r) => {
    const cls = `${r.active ? "active" : ""}${r.id === selected ? " selected" : ""}`;
    if (r.active) {
      const pc = PC(r)[horizon];
      return `<li class="${cls}" data-id="${r.id}"><span class="name">${name(r.id)}<small>${t.alert} ${duration(r.alert_minutes, t)}</small></span><span class="pct">${pct(pc)}</span><span></span><span class="bar"><i style="width:${Math.max(pc * 100, 1)}%;background:${clearColor(pc)}"></i></span></li>`;
    }
    const p = P(r)[horizon];
    return `<li class="${cls}" data-id="${r.id}"><span class="name">${name(r.id)}</span><span class="pct">${pct(p)}</span><span></span><span class="bar"><i style="width:${Math.max(p * 100, 1)}%;background:${color(p)}"></i></span></li>`;
  }).join("");

  const stale = Date.now() - new Date(state.generated_at) > 3 * 60 * 1000;
  $("asof").innerHTML = `${t.asof} <b>${time(state.generated_at)}</b> · ${stale ? `<span class="stale">${t.stale}</span>` : t.every}`;
  $("foot").innerHTML =
    (state.last_post_at ? `<div>${t.lastPost} ${time(state.last_post_at)}</div>` : "") +
    `<div>${t.model} ${state.model} + ${state.clear_model}, ${t.trained} ${date(state.trained_until)}</div>` +
    (variant === "untested" && !$("variant").hidden ? `<div>${t.untestedNote}</div>` : "") +
    `<div>${t.note}</div>`;
}

// Forecasts of the chosen model and horizon in one part of an alert's history (null where nothing was logged).
const series = (part) => (variant === "untested" ? part.pu : part.p)[horizon] ?? [];
const leadLabel = (m, t) => (m < 60 ? `${m} ${t.min}` : `${m / 60} ${t.hr}`);

// Logged value `m` minutes before `event`: the last point at or before then, at most 2 minutes earlier.
function valueAt(part, m, event) {
  const target = event - m * 60, s = series(part);
  let v = null;
  for (let i = 0; i < part.t.length && part.t[i] <= target; i++) v = target - part.t[i] <= 120 ? s[i] : null;
  return v;
}

// Line of forecasts before `event` (siren start or all-clear); the last `horizon` before it is shaded: there the
// event did happen within the horizon. The window shown is twice the horizon, 1-6 h.
// Chart margins in CSS pixels; the viewBox width is the panel's pixel width, so text stays the same size on any screen.
const CH = { H: 112, L: 36, R: 4, TOP: 8, B: 20 };
function chart(part, kind, event) {
  const W = $("history").clientWidth || 360, { H, L, R, TOP, B } = CH, hm = HMIN[horizon], s = series(part);
  const x0 = Math.max(event - Math.min(360, Math.max(60, 2 * hm)) * 60, part.t[0] ?? event), x1 = event;
  const X = (ts) => L + ((ts - x0) / (x1 - x0 || 1)) * (W - L - R), Y = (p) => TOP + (1 - p) * (H - TOP - B);
  const hue = kind === "start" ? "var(--red)" : CLEAR_RAMPS[document.documentElement.dataset.theme][3];
  let d = "", last = null;
  part.t.forEach((ts, i) => {
    if (ts < x0 || s[i] == null) return void (last = null);
    d += `${last !== null && ts - last <= 180 ? "L" : "M"}${X(ts).toFixed(1)},${Y(s[i]).toFixed(1)}`;
    last = ts;
  });
  const span = (x1 - x0) / 60, step = span <= 70 ? 15 : span <= 130 ? 30 : 60, t = T[lang];
  let ticks = "";
  for (let m = 0; m <= span; m += step) ticks += `<text x="${X(event - m * 60)}" y="${H - 6}" font-size="11"${m ? "" : ' style="text-anchor:end"'}>${m ? "−" + leadLabel(m, t) : "0"}</text>`;
  const hx = X(Math.max(event - hm * 60, x0));
  return `<svg viewBox="0 0 ${W} ${H}" data-kind="${kind}" data-event="${event}" data-x0="${x0}" data-w="${W}">
    <rect x="${hx}" y="${TOP}" width="${X(x1) - hx}" height="${H - TOP - B}" fill="${hue}" opacity="0.16"/>
    ${[0, 0.5, 1].map((p) => `<line x1="${L}" x2="${W - R}" y1="${Y(p)}" y2="${Y(p)}" stroke="var(--line)" stroke-width="1.5"/><text x="${L - 5}" y="${Y(p)}" font-size="11" style="text-anchor:end">${p * 100}%</text>`).join("")}
    <line x1="${X(x1)}" x2="${X(x1)}" y1="${TOP}" y2="${H - B}" stroke="${hue}" stroke-width="2"/>
    <path d="${d}" fill="none" stroke="${hue}" stroke-width="2.5" stroke-linejoin="round"/>
    ${ticks}<g class="cur"></g></svg>`;
}

function renderHistory(t) {
  const box = $("history");
  if (!selected || hist?.region !== selected) return void (box.innerHTML = "");
  if (!hist.alerts.length) return void (box.innerHTML = `<div class="dim">${t.noAlerts} ${hist.since ? date(hist.since * 1000) : "—"}.</div>`);
  const a = hist.alerts.find((x) => x.start === hist.start), data = hist.data;
  let out = "";
  if (data && !series(data.before_start).some((v) => v != null) && !series(data.before_end).some((v) => v != null)) {
    out += `<div class="dim">${t.noRecord}</div>`;
  } else if (data) {
    const hm = HMIN[horizon], row = (label, part, event) =>
      `<tr><td>${label}</td>${LEADS.map((m) => `<td class="${m <= hm ? "in" : ""}">${!event ? t.ongoing : valueAt(part, m, event) == null ? "—" : pct(valueAt(part, m, event))}</td>`).join("")}</tr>`;
    out += `<table><tr><th></th>${LEADS.map((m) => `<th>${leadLabel(m, t)}</th>`).join("")}</tr>` +
      row(t.beforeStart, data.before_start, data.start) + row(t.beforeEnd, data.before_end, data.end) + "</table>";
    const part = (kind, p, event, label) => p.t.length
      ? `<div class="hl"><span>${label} <b>${time(event * 1000)}</b></span><span id="read-${kind}"></span></div>${chart(p, kind, event)}` : "";
    out += part("start", data.before_start, data.start, t.chartStart);
    if (data.end) out += part("clear", data.before_end, data.end, t.chartEnd);
    out += `<div class="dim">${t.histNote(t.h[horizon])}</div>`;
  }
  out += `<ol>${hist.alerts.map((x) => `<li data-start="${x.start}"${x === a ? ' class="selected"' : ""}><span>${date(x.start * 1000)} ${time(x.start * 1000)}–${x.end ? time(x.end * 1000) : t.ongoing}</span>` +
    `<span>${x.end ? duration(Math.round((x.end - x.start) / 60), t) : ""}</span></li>`).join("")}</ol>`;
  box.innerHTML = out;
}

// Chart cursor: the point nearest the pointer, drawn in place (no re-render, so a drag is not interrupted).
function scrub(e) {
  const svg = e.target.closest("svg");
  if (!svg || !hist?.data) return;
  const kind = svg.dataset.kind, event = +svg.dataset.event, x0 = +svg.dataset.x0;
  const part = kind === "start" ? hist.data.before_start : hist.data.before_end, s = series(part);
  const W = +svg.dataset.w, { H, L, R, TOP, B } = CH, box = svg.getBoundingClientRect(), vx = ((e.clientX - box.left) / box.width) * W;
  const ts = x0 + ((vx - L) / (W - L - R)) * (event - x0);
  let best = -1;
  part.t.forEach((v, i) => { if (v >= x0 && s[i] != null && (best < 0 || Math.abs(v - ts) < Math.abs(part.t[best] - ts))) best = i; });
  if (best < 0) return;
  const x = L + ((part.t[best] - x0) / (event - x0 || 1)) * (W - L - R), y = TOP + (1 - s[best]) * (H - TOP - B), t = T[lang];
  svg.querySelector(".cur").innerHTML = `<line x1="${x}" x2="${x}" y1="${TOP}" y2="${H - B}" stroke="var(--fg)" stroke-width="1.5"/><circle cx="${x}" cy="${y}" r="5" fill="var(--fg)"/>`;
  $(`read-${kind}`).innerHTML = `${time(part.t[best] * 1000)} · ${t.lead(duration(Math.round((event - part.t[best]) / 60), t), kind)} · <b>${pct(s[best])}</b>`;
}

async function getJSON(url) {
  try {
    const res = await fetch(url, { cache: "no-store" });
    return res.ok ? await res.json() : null;
  } catch { return null; }
}

// Alert list of the selected oblast; keeps the picked alert (default: the latest) and refetches its forecasts while it runs.
async function loadHistory() {
  const region = selected;
  if (!region) return void (hist = null);
  const list = await getJSON(`history.json?region=${region}`);
  if (!list || selected !== region) return;
  const prev = hist?.region === region ? hist : null;
  const start = prev && list.alerts.some((a) => a.start === prev.start) ? prev.start : list.alerts[0]?.start;
  const alert = list.alerts.find((a) => a.start === start);
  const data = prev?.start === start ? prev.data : null;
  hist = { region, since: list.since, alerts: list.alerts, start, data };
  if (alert && (!data || alert.end === null || data.end !== alert.end)) await loadAlert(start);
  render();
}

async function loadAlert(start) {
  const region = hist.region, data = await getJSON(`history.json?region=${region}&start=${start}`);
  if (data && hist?.region === region && hist.start === start) hist.data = data;
}

async function load() {
  const s = await getJSON("state.json");
  if (s) state = s;
  render();
  if (selected) loadHistory();
}

function select(e) {
  const id = e.target.closest("[data-id]")?.dataset.id;
  if (!id) return;
  selected = selected === id ? null : id;
  render();
  if (selected) loadHistory();
  if (selected && e.currentTarget === $("list")) $("caption").scrollIntoView({ block: "start" });
}

$("map").addEventListener("click", select);
$("list").addEventListener("click", select);
$("history").addEventListener("click", async (e) => {
  const li = e.target.closest("li[data-start]");
  if (!li || !hist) return;
  hist.start = +li.dataset.start;
  hist.data = null;
  render();
  await loadAlert(hist.start);
  render();
});
$("history").addEventListener("pointerdown", scrub);
$("history").addEventListener("pointermove", (e) => { if (e.pointerType === "mouse" || e.buttons) scrub(e); });
$("horizon").addEventListener("change", (e) => { horizon = e.target.value; localStorage.setItem("horizon", horizon); render(); });
$("variant").addEventListener("change", (e) => { variant = e.target.value; localStorage.setItem("variant", variant); render(); });
$("lang").addEventListener("click", () => { lang = lang === "uk" ? "en" : "uk"; localStorage.setItem("lang", lang); render(); });
$("theme").addEventListener("click", () => {
  theme = { auto: "dark", dark: "light", light: "auto" }[theme];
  localStorage.setItem("theme", theme);
  applyTheme(); render();
});
matchMedia("(prefers-color-scheme: light)").addEventListener("change", () => { if (theme === "auto") { applyTheme(); render(); } });
applyTheme();
fetch("ukraine.json").then((r) => r.json()).then((g) => { geo = g; render(); });
load();
setInterval(load, 30000);
</script>
</body>
